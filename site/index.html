<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F7F2E8">
<title>Home</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mate:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #F7F2E8;
    --card: #FDFBF6;
    --ink: #3C443C;
    --ink-soft: #8A8578;
    --ink-faint: #A8A294;
    --lake: #4A6B5D;
    --glass: #8FB8A8;
    --glass-pale: #E4EDE6;
    --clay: #C57A3E;
    --clay-pale: #F6E6D6;
    --clay-line: #E0B18C;
    --line: #E6DECF;
    --line-soft: #EFE8DA;
    --radius: 14px;
    --serif: Georgia, 'Times New Roman', serif;
    --display: 'Mate', Georgia, serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background-color: var(--ground);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.55;
    padding-bottom: 96px;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.09'/></svg>");
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 22px 17px 0; position: relative; z-index: 1; }

  h1 { font-family: var(--display); font-size: 25px; font-weight: 400; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-soft); font-size: 14px; font-style: italic; margin: 0 0 6px; }
  h2 { font-family: var(--display); font-size: 18px; font-weight: 400; margin: 30px 0 10px; color: var(--lake); }

  .seasonal { margin: 8px 0 16px; color: var(--glass); }
  .seasonal svg { display: block; }
  .daylabel {
    font-family: var(--display); font-size: 16.5px; color: var(--lake);
    margin: 24px 0 8px; display: flex; align-items: center; gap: 9px;
  }
  .daylabel .mini { color: var(--glass); flex-shrink: 0; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 3px 16px; margin-bottom: 12px; }
  .row { display: flex; gap: 13px; align-items: flex-start; padding: 13px 0; border-top: 1px solid var(--line-soft); }
  .row:first-child { border-top: none; }

  .box {
    width: 23px; height: 23px; min-width: 23px; margin-top: 2px;
    border: 1.5px solid #C7BFAE; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
    border-radius: 11px 9px 12px 10px;
    transition: background .18s ease, border-color .18s ease;
  }
  .row:nth-child(2n) .box { border-radius: 10px 12px 9px 11px; }
  .row:nth-child(3n) .box { border-radius: 12px 10px 11px 9px; }
  .row:nth-child(5n) .box { border-radius: 9px 11px 10px 12px; }
  .box:hover { border-color: var(--glass); }
  .box svg { opacity: 0; width: 12px; height: 12px; transition: opacity .18s ease; }
  .box.on { background: var(--glass); border-color: var(--glass); }
  .box.on svg { opacity: 1; }

  .rowtext { flex: 1; min-width: 0; }
  .title { font-size: 15.5px; }
  .row.done .title { color: var(--ink-faint); text-decoration: line-through; }
  .meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }
  .meta.late { color: var(--clay); font-style: italic; }
  .since { font-style: italic; color: var(--ink-faint); }
  .since::before { content: ' \00b7 '; font-style: normal; }
  .future { opacity: .6; }
  .row.late .box { border-color: var(--clay-line); }

  .ripple {
    position: fixed; border-radius: 50%; border: 1.5px solid var(--glass);
    pointer-events: none; z-index: 40; opacity: .9;
    animation: spread .7s cubic-bezier(.22,.7,.3,1) forwards;
  }
  .ripple.two { animation-delay: .11s; opacity: .55; }
  @keyframes spread {
    from { transform: scale(.35); opacity: .85; }
    to   { transform: scale(3.6); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .ripple { display: none; } }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
    border-top: 1px solid var(--line); display: flex; z-index: 20;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar button {
    flex: 1; border: none; background: none; padding: 11px 4px 13px; cursor: pointer;
    font-family: var(--display); font-size: 13px; color: var(--ink-faint);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .tabbar button.on { color: var(--lake); }
  .tabbar svg { width: 21px; height: 21px; }

  .fab {
    position: fixed; right: 18px; bottom: 84px; width: 54px; height: 54px;
    border-radius: 27px 25px 28px 26px; background: var(--lake); color: var(--ground);
    border: none; cursor: pointer; z-index: 21;
    box-shadow: 0 3px 14px rgba(60,68,60,.2); display: flex; align-items: center; justify-content: center;
  }
  .fab svg { width: 25px; height: 25px; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(60,68,60,.32); z-index: 30; display: none; }
  .sheet-bg.open { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); z-index: 31;
    border-radius: 18px 18px 0 0; padding: 20px 18px calc(24px + env(safe-area-inset-bottom));
    max-width: 480px; margin: 0 auto; max-height: 88vh; overflow-y: auto; display: none;
  }
  .sheet.open { display: block; }
  .sheet h3 { font-family: var(--display); font-weight: 400; margin: 0 0 14px; font-size: 19px; }

  label { display: block; font-size: 13px; color: var(--ink-soft); margin: 13px 0 4px; font-style: italic; }
  input[type=text], input[type=date], input[type=number], select, textarea {
    width: 100%; font-family: var(--serif); font-size: 16px; padding: 10px 12px; color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
  }
  textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--glass); outline-offset: -1px; border-color: var(--glass); }
  .btn {
    font-family: var(--display); font-size: 15.5px; padding: 11px 16px; border-radius: 11px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; width: 100%;
  }
  .btn.primary { background: var(--lake); border-color: var(--lake); color: var(--ground); }
  .btn.danger { color: var(--clay); border-color: var(--clay-line); }
  .btn.mini { width: auto; padding: 7px 13px; font-size: 14px; }
  .btnrow { display: flex; gap: 10px; margin-top: 18px; }
  .empty { color: var(--ink-soft); font-size: 14.5px; font-style: italic; padding: 18px 2px; }
  .link { background: none; border: none; font-family: var(--serif); font-size: 13px; color: var(--ink-faint); cursor: pointer; padding: 4px; }
  .titlebtn {
    font-family: var(--serif); font-size: 15.5px; color: var(--ink); background: none; border: none;
    padding: 0; cursor: pointer; text-align: left; border-bottom: 1px dashed #C7BFAE;
  }
  .titlebtn:hover { color: var(--lake); border-bottom-color: var(--glass); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
  .chip {
    font-family: var(--serif); font-size: 13.5px; padding: 5px 12px; border-radius: 14px 12px 15px 13px;
    border: 1px solid var(--line); background: #fff; cursor: pointer; color: var(--ink-soft);
  }
  .chip.on { background: var(--glass-pale); border-color: var(--glass); color: var(--lake); }
  .pill { display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 12px; background: var(--glass-pale); color: var(--lake); }
  .pill.clay { background: var(--clay-pale); color: var(--clay); }
  .total { display: flex; justify-content: space-between; font-family: var(--display); font-size: 17px; padding: 15px 16px; }
  .price-in { width: 74px; font-size: 14px; padding: 5px 8px; text-align: right; }
  .hstack { display: flex; align-items: center; gap: 8px; }
  .tabpanel { display: none; }
  .tabpanel.on { display: block; }
</style>
</head>
<body>

<div class="wrap">
  <div id="tab-todo" class="tabpanel on"></div>
  <div id="tab-meals" class="tabpanel"></div>
  <div id="tab-list" class="tabpanel"></div>
</div>

<button class="fab" id="fab" aria-label="Add">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabbar">
  <button data-tab="todo" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    To-do
  </button>
  <button data-tab="meals">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7a3 3 0 003 3 3 3 0 003-3V2"/><path d="M6 2v20"/><path d="M18 2v20"/><path d="M18 12c2 0 3-1.5 3-4s-1-6-3-6"/></svg>
    Meals
  </button>
  <button data-tab="list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
    List
  </button>
</nav>

<div class="sheet-bg" id="sheetbg"></div>
<div class="sheet" id="sheet"></div>

<script>
// ---------- storage ----------
var KEY = 'household.v2';
var db = null;

function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { console.warn('Could not save', e); } }
function load() {
  try { var raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return null;
}
function uid() { return Math.random().toString(36).slice(2, 10); }

// ---------- dates ----------
function ymd(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parseYmd(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function today() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function daysBetween(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
var DAYNAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function ordinal(n) {
  var s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function longDate(d) { return DAYNAMES[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + ordinal(d.getDate()); }
function shortDate(s) { var d = parseYmd(s); return MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate(); }

function everyLabel(n) {
  if (n === 1) return 'daily';
  if (n === 2) return 'every other day';
  if (n === 7) return 'weekly';
  if (n === 14) return 'every 2 weeks';
  if (n === 30) return 'monthly';
  if (n === 91) return 'every 3 months';
  if (n === 182) return 'every 6 months';
  if (n === 365) return 'yearly';
  if (n % 7 === 0) return 'every ' + (n / 7) + ' weeks';
  return 'every ' + n + ' days';
}

function lastDoneLabel(c) {
  if (c.never) return 'not done yet';
  var n = daysBetween(c.last, ymd(today()));
  if (n <= 0) return 'done today';
  if (n === 1) return 'last done yesterday';
  if (n < 14) return 'last done ' + n + ' days ago';
  if (n < 70) return 'last done ' + Math.round(n / 7) + ' weeks ago';
  if (n < 365) return 'last done ' + Math.round(n / 30) + ' months ago';
  return 'last done ' + shortDate(c.last);
}

// ---------- seasonal drawings ----------
// Sep-Nov autumn, Dec-Feb winter, Mar-May spring, Jun-Aug summer.
function seasonOf(d) {
  var m = d.getMonth();
  if (m >= 8 && m <= 10) return 'autumn';
  if (m === 11 || m <= 1) return 'winter';
  if (m >= 2 && m <= 4) return 'spring';
  return 'summer';
}

var ART = {
  // a branch, leaves still holding on, two letting go
  autumn: '<path d="M4 36 C20 33, 36 27, 54 16 C60 12, 66 10, 72 9" />'
    + '<path d="M22 32 C22 25, 28 21, 34 23 C34 30, 28 34, 22 32 Z" />'
    + '<path d="M44 24 C44 17, 50 13, 56 15 C56 22, 50 26, 44 24 Z" />'
    + '<path d="M63 13 C63 7, 68 4, 73 6 C73 12, 68 15, 63 13 Z" />'
    + '<path d="M88 16 C88 10, 94 7, 99 9 C99 15, 94 18, 88 16 Z" /><path d="M93 13 L89 18" />'
    + '<path d="M101 33 C101 27, 107 24, 112 26 C112 32, 107 35, 101 33 Z" /><path d="M106 30 L102 35" />'
    + '<path d="M84 24 C87 27, 90 27, 93 25" />',
  // peak, snow line, one small star
  winter: '<path d="M4 40 L28 14 L44 32 L56 20 L82 40 Z" /><path d="M20 24 C24 28, 30 26, 34 22" />'
    + '<path d="M50 26 C54 30, 58 29, 61 26" /><path d="M100 14 L100 26" /><path d="M94 20 L106 20" />'
    + '<path d="M96 16 L104 24" /><path d="M104 16 L96 24" />',
  // a rose, spiralling open, on a leafy stem
  spring: '<path d="M60 34 C60 26, 58 20, 54 15" />'
    + '<path d="M59 28 C53 27, 49 23, 48 18 C54 18, 59 22, 60 27" />'
    + '<path d="M60 24 C64 21, 66 16, 65 11 C60 13, 57 18, 58 23" />'
    + '<path d="M56 12 C53 12, 52 15, 54 16 C57 17, 59 14, 58 11 C57 7, 52 6, 49 10 C46 14, 48 20, 54 21 C61 22, 66 16, 64 9" />'
    + '<path d="M14 40 C14 30, 20 24, 26 22" /><path d="M18 30 C14 27, 12 22, 13 18 C18 19, 21 24, 21 28" />'
    + '<path d="M96 40 C96 31, 102 25, 108 23" /><path d="M100 30 C104 26, 110 25, 114 27" />',
  // a lily pad on still water, one bud
  summer: '<path d="M28 30 C16 30, 8 26, 8 21 C8 16, 16 12, 28 12 C40 12, 48 16, 48 21 C48 26, 40 30, 28 30 Z" />'
    + '<path d="M28 21 L47 18" /><path d="M28 21 L47 25" />'
    + '<path d="M28 21 L27 12" /><path d="M28 21 L12 17" /><path d="M28 21 L14 26" />'
    + '<path d="M76 30 C74 24, 75 17, 79 12 C83 17, 84 24, 82 30 Z" /><path d="M79 12 L79 30" />'
    + '<path d="M6 40 C16 37, 28 37, 38 40" /><path d="M58 42 C68 39, 80 39, 90 42" />'
    + '<path d="M96 34 C104 31, 112 31, 118 34" />'
};

function seasonalArt(d, small) {
  var art = ART[seasonOf(d)];
  if (small) {
    return '<svg class="mini" width="22" height="10" viewBox="0 0 120 48" fill="none" stroke="currentColor" '
      + 'stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + art + '</svg>';
  }
  return '<div class="seasonal"><svg width="120" height="48" viewBox="0 0 120 48" fill="none" stroke="currentColor" '
    + 'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="'
    + seasonOf(d) + '">' + art + '</svg></div>';
}

// ---------- seed ----------
function seed() {
  var t = today();
  var chores = [];
  function add(title, every, offset) {
    chores.push({ id: uid(), title: title, every: every, last: ymd(addDays(t, offset - every)), never: true });
  }
  // daily
  ['Dishes', 'Tidy main living space (10 min)', 'Wipe kitchen counters', 'Exercise', 'Scriptures']
    .forEach(function (n) { add(n, 1, 0); });
  // every other day
  add('Sweep', 2, 0);
  add('Laundry (one load, wash-dry-fold)', 2, 1);
  // weekly, anchored to weekdays
  function nextWeekday(dow) { var diff = (dow - t.getDay() + 7) % 7; return diff; }
  [['Grocery shopping', 1], ['Meal prep', 1],
   ['Take out all trash', 2], ['Wash bedding', 3], ['Bathrooms', 4],
   ['Mop floors', 5], ['Dusting', 5], ['Vacuum floors', 6],
   ['Water plants', 0], ['Clear out the fridge', 0]]
    .forEach(function (p) { add(p[0], 7, nextWeekday(p[1])); });
  // monthly, one per week
  [['Wash bath mats and robes', 3], ['Clean out car', 8], ['Vacuum under and behind furniture', 13],
   ['Wipe baseboards and door handles', 18], ['Check pantry for expired items', 23], ['Clean the microwave and stovetop', 28]]
    .forEach(function (p) { add(p[0], 30, p[1]); });
  // quarterly
  [['Clean inside the fridge', 10], ['Wash windows', 30], ["Sort kids' clothes for outgrown sizes", 50], ['Clean out under sinks', 70]]
    .forEach(function (p) { add(p[0], 91, p[1]); });
  // semi-annual
  [['Change furnace filter', 10], ['Flip or rotate mattress', 30], ['Test smoke and CO detectors', 57],
   ['Clean dryer vent', 75], ['Deep clean oven', 100]]
    .forEach(function (p) { add(p[0], 182, p[1]); });
  // annual
  [['Service the furnace or A/C', 20], ['Wash curtains', 40], ['Purge closets and donate', 60],
   ['Descale water heater', 120], ['Clean carpets', 200]]
    .forEach(function (p) { add(p[0], 365, p[1]); });

  return { chores: chores, events: [], recipes: [], pantry: [], plan: [], list: [], prices: {} };
}

// ---------- schedule ----------
// Returns an array of {date, items:[...]} for the next `days` days.
function buildSchedule(days) {
  var t = today(), tStr = ymd(t), out = [];
  var byDate = {};
  for (var i = 0; i < days; i++) { var k = ymd(addDays(t, i)); byDate[k] = []; }

  db.chores.forEach(function (c) {
    if (c.last === tStr && !c.never) {
      byDate[tStr].push({ kind: 'chore', id: c.id, title: c.title, note: everyLabel(c.every), since: lastDoneLabel(c), date: tStr });
    }
    var due = addDays(parseYmd(c.last), c.every);
    if (due < t) due = t;  // overdue folds onto today, never piles up
    for (var d = due; daysBetween(tStr, ymd(d)) < days; d = addDays(d, c.every)) {
      var k = ymd(d);
      if (byDate[k]) byDate[k].push({ kind: 'chore', id: c.id, title: c.title, note: everyLabel(c.every), since: lastDoneLabel(c), date: k });
      if (c.every > 400) break;
    }
  });

  db.events.forEach(function (e) {
    if (e.done) return;
    var k = e.date;
    if (daysBetween(tStr, k) < 0) {
      byDate[tStr].push({ kind: 'event', id: e.id, title: e.title, note: 'was due ' + shortDate(k), late: true, date: tStr });
    } else if (byDate[k]) {
      byDate[k].push({ kind: 'event', id: e.id, title: e.title, note: 'appointment', date: k });
    }
  });

  for (var j = 0; j < days; j++) {
    var day = addDays(t, j), key = ymd(day);
    out.push({ date: day, key: key, items: byDate[key] });
  }
  return out;
}

function doneToday(id) {
  var c = db.chores.filter(function (x) { return x.id === id; })[0];
  return !!c && c.last === ymd(today()) && !c.never;
}

function ripple(el) {
  if (!el || !el.getBoundingClientRect) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var r = el.getBoundingClientRect();
  var cx = r.left + r.width / 2, cy = r.top + r.height / 2, size = 30;
  [0, 1].forEach(function (n) {
    var s = document.createElement('span');
    s.className = 'ripple' + (n ? ' two' : '');
    s.style.left = (cx - size / 2) + 'px';
    s.style.top = (cy - size / 2) + 'px';
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    document.body.appendChild(s);
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 900);
  });
}

// ---------- to-do tab ----------
function renderTodo() {
  var t = today();
  var sched = buildSchedule(14);
  var h = '<h1>' + longDate(t) + '</h1>';
  var todayCount = sched[0].items.filter(function (i) { return !(i.kind === 'chore' && doneToday(i.id)); }).length;
  h += '<p class="sub">' + (todayCount === 0 ? 'Nothing left today. Go sit outside.' : todayCount + (todayCount === 1 ? ' thing today' : ' things today')) + '</p>';
  h += seasonalArt(t, false);

  sched.forEach(function (day, idx) {
    if (day.items.length === 0 && idx > 0) return;
    if (idx > 0) {
      h += '<div class="daylabel">' + seasonalArt(day.date, true) + '<span>'
        + DAYNAMES[day.date.getDay()] + ', ' + MONTHS[day.date.getMonth()] + ' ' + ordinal(day.date.getDate()) + '</span></div>';
    }
    if (day.items.length === 0) {
      h += '<div class="card"><div class="empty">Nothing scheduled. Tap + to add something.</div></div>';
      return;
    }
    h += '<div class="card">';
    day.items.forEach(function (it) {
      var isDone = it.kind === 'chore' ? (idx === 0 && doneToday(it.id)) : false;
      var future = idx > 0;
      h += '<div class="row' + (isDone ? ' done' : '') + (future ? ' future' : '') + (it.late ? ' late' : '') + '">'
        + '<button class="box' + (isDone ? ' on' : '') + '" ' + (future ? 'disabled' : '')
        + ' data-check="' + it.kind + ':' + it.id + '" aria-label="Mark done">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
        + '</button>'
        + '<div class="rowtext"><div class="title">' + esc(it.title) + '</div>'
        + '<div class="meta' + (it.late ? ' late' : '') + '">' + esc(it.note)
        + (it.since && !future ? '<span class="since">' + esc(it.since) + '</span>' : '') + '</div></div>'
        + '<button class="link" data-del="' + it.kind + ':' + it.id + '" aria-label="Delete">&times;</button>'
        + '</div>';
    });
    h += '</div>';
  });
  document.getElementById('tab-todo').innerHTML = h;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// ---------- meals tab ----------
function norm(s) { return s.trim().toLowerCase(); }

function missingFor(recipe) {
  var have = db.pantry.map(norm);
  return recipe.ingredients.filter(function (ing) { return have.indexOf(norm(ing)) === -1; });
}

function renderMeals() {
  var h = '<h1>Meals</h1><p class="sub">Tick what you have, and see what you can cook.</p>';

  h += '<h2>In the kitchen</h2>';
  if (db.pantry.length === 0) {
    h += '<div class="empty">Nothing ticked yet. Add ingredients below as you use recipes, then tick what is on hand.</div>';
  }
  var known = {};
  db.recipes.forEach(function (r) { r.ingredients.forEach(function (i) { known[norm(i)] = i; }); });
  db.pantry.forEach(function (p) { known[norm(p)] = p; });
  var keys = Object.keys(known).sort();
  if (keys.length) {
    h += '<div class="chips">';
    keys.forEach(function (k) {
      var on = db.pantry.map(norm).indexOf(k) > -1;
      h += '<button class="chip' + (on ? ' on' : '') + '" data-pantry="' + esc(known[k]) + '">' + esc(known[k]) + '</button>';
    });
    h += '</div>';
  }

  h += '<h2>This week\'s plan</h2>';
  if (db.plan.length === 0) {
    h += '<div class="empty">No meals picked yet.</div>';
  } else {
    h += '<div class="card">';
    db.plan.forEach(function (id) {
      var r = db.recipes.filter(function (x) { return x.id === id; })[0];
      if (!r) return;
      h += '<div class="row"><div class="rowtext"><div class="title">' + esc(r.name) + '</div>'
        + '<div class="meta">' + r.ingredients.length + ' ingredients</div></div>'
        + '<button class="link" data-unplan="' + r.id + '">Remove</button></div>';
    });
    h += '</div>';
    h += '<button class="btn primary" data-buildlist="1">Build grocery list from plan</button>';
  }

  h += '<h2>Your recipes</h2>';
  if (db.recipes.length === 0) {
    h += '<div class="empty">No recipes yet. Tap + to add the first one — name plus ingredients, one per line.</div>';
  } else {
    var sorted = db.recipes.slice().sort(function (a, b) { return missingFor(a).length - missingFor(b).length; });
    h += '<div class="card">';
    sorted.forEach(function (r) {
      var miss = missingFor(r);
      var planned = db.plan.indexOf(r.id) > -1;
      var pill = miss.length === 0
        ? '<span class="pill">can make now</span>'
        : '<span class="pill clay">need ' + miss.length + '</span>';
      h += '<div class="row"><div class="rowtext"><button class="titlebtn" data-editrecipe="' + r.id + '">'
        + esc(r.name) + '</button> ' + pill
        + '<div class="meta">' + (miss.length ? esc(miss.slice(0, 4).join(', ')) + (miss.length > 4 ? '…' : '') : esc(r.ingredients.slice(0, 4).join(', '))) + '</div></div>'
        + (planned ? '<span class="meta">planned</span>' : '<button class="btn mini" data-plan="' + r.id + '">Add</button>')
        + '</div>';
    });
    h += '</div>';
  }
  document.getElementById('tab-meals').innerHTML = h;
}

function buildList() {
  var have = db.pantry.map(norm);
  var existing = db.list.map(function (i) { return norm(i.name); });
  var added = 0;
  db.plan.forEach(function (id) {
    var r = db.recipes.filter(function (x) { return x.id === id; })[0];
    if (!r) return;
    r.ingredients.forEach(function (ing) {
      var n = norm(ing);
      if (have.indexOf(n) > -1) return;
      if (existing.indexOf(n) > -1) return;
      existing.push(n);
      db.list.push({ id: uid(), name: ing, price: db.prices[n] || null, checked: false });
      added++;
    });
  });
  save(); renderAll(); go('list');
}

// ---------- list tab ----------
function renderList() {
  var h = '<h1>Grocery list</h1>';
  var total = 0, priced = 0;
  db.list.forEach(function (i) { if (i.price) { total += i.price; priced++; } });
  h += '<p class="sub">' + db.list.length + ' items' + (priced ? ' · ' + priced + ' priced' : '') + '</p>';

  if (db.list.length === 0) {
    h += '<div class="empty">Empty. Tap + to add something, or build it from your meal plan.</div>';
  } else {
    h += '<div class="card">';
    db.list.forEach(function (i) {
      h += '<div class="row' + (i.checked ? ' done' : '') + '">'
        + '<button class="box' + (i.checked ? ' on' : '') + '" data-gcheck="' + i.id + '" aria-label="Got it">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
        + '</button>'
        + '<div class="rowtext"><div class="title">' + esc(i.name) + '</div></div>'
        + '<div class="hstack"><input class="price-in" type="number" step="0.01" min="0" placeholder="$" '
        + 'value="' + (i.price != null ? i.price : '') + '" data-price="' + i.id + '">'
        + '<button class="link" data-gdel="' + i.id + '" aria-label="Remove">&times;</button></div>'
        + '</div>';
    });
    h += '</div>';
    h += '<div class="card total"><span>Estimated total</span><span>$' + total.toFixed(2) + '</span></div>';
    if (priced < db.list.length) {
      h += '<p class="sub">' + (db.list.length - priced) + ' item' + (db.list.length - priced === 1 ? '' : 's') + ' still need a price. Type one in once and it is remembered next time.</p>';
    }
    h += '<div class="btnrow"><button class="btn" data-clearchecked="1">Clear checked off</button></div>';
  }
  document.getElementById('tab-list').innerHTML = h;
}

// ---------- sheets ----------
var sheet = document.getElementById('sheet'), sheetbg = document.getElementById('sheetbg');
function openSheet(html) { sheet.innerHTML = html; sheet.classList.add('open'); sheetbg.classList.add('open'); }
function closeSheet() { sheet.classList.remove('open'); sheetbg.classList.remove('open'); sheet.innerHTML = ''; }
sheetbg.onclick = closeSheet;

function sheetChore() {
  openSheet('<h3>Add to the to-do list</h3>'
    + '<label for="s-title">What is it?</label><input id="s-title" type="text" placeholder="Wipe down the high chair">'
    + '<label for="s-kind">How often?</label>'
    + '<select id="s-kind">'
    + '<option value="1">Every day</option><option value="2">Every other day</option>'
    + '<option value="7" selected>Every week</option><option value="14">Every 2 weeks</option>'
    + '<option value="30">Every month</option><option value="91">Every 3 months</option>'
    + '<option value="182">Every 6 months</option><option value="365">Every year</option>'
    + '<option value="once">Just once, on a date</option></select>'
    + '<div id="s-when"><label for="s-start">First one due</label><input id="s-start" type="date" value="' + ymd(today()) + '"></div>'
    + '<div class="btnrow"><button class="btn" data-close="1">Cancel</button><button class="btn primary" data-savechore="1">Add</button></div>');
}

function sheetRecipe(id) {
  var r = id ? db.recipes.filter(function (x) { return x.id === id; })[0] : null;
  openSheet('<h3>' + (r ? 'Edit recipe' : 'Add a recipe') + '</h3>'
    + '<label for="r-name">Name</label><input id="r-name" type="text" placeholder="Chicken and rice bowls" value="'
    + (r ? esc(r.name) : '') + '">'
    + '<label for="r-ing">Ingredients, one per line</label>'
    + '<textarea id="r-ing" placeholder="chicken thighs&#10;rice&#10;broccoli&#10;soy sauce">'
    + (r ? esc(r.ingredients.join('\n')) : '') + '</textarea>'
    + '<div class="btnrow"><button class="btn" data-close="1">Cancel</button>'
    + '<button class="btn primary" data-saverecipe="' + (r ? r.id : '1') + '">'
    + (r ? 'Save changes' : 'Add') + '</button></div>'
    + (r ? '<div class="btnrow"><button class="btn danger" data-delrecipe="' + r.id + '">Delete this recipe</button></div>' : ''));
}

function sheetItem() {
  openSheet('<h3>Add to the grocery list</h3>'
    + '<label for="g-name">Item</label><input id="g-name" type="text" placeholder="Laundry detergent">'
    + '<label for="g-price">Price, if you know it</label><input id="g-price" type="number" step="0.01" min="0" placeholder="0.00">'
    + '<div class="btnrow"><button class="btn" data-close="1">Cancel</button><button class="btn primary" data-saveitem="1">Add</button></div>');
}

// ---------- events / wiring ----------
var current = 'todo';
function go(tab) {
  current = tab;
  ['todo', 'meals', 'list'].forEach(function (t) {
    document.getElementById('tab-' + t).classList.toggle('on', t === tab);
  });
  document.querySelectorAll('.tabbar button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.tab === tab);
  });
  window.scrollTo(0, 0);
}

function renderAll() { renderTodo(); renderMeals(); renderList(); }

document.querySelectorAll('.tabbar button').forEach(function (b) {
  b.onclick = function () { go(b.dataset.tab); };
});

document.getElementById('fab').onclick = function () {
  if (current === 'todo') sheetChore();
  else if (current === 'meals') sheetRecipe();
  else sheetItem();
};

document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 's-kind') {
    var lbl = document.querySelector('#s-when label');
    if (lbl) lbl.textContent = t.value === 'once' ? 'Date' : 'First one due';
  }
  if (t.dataset && t.dataset.price) {
    var item = db.list.filter(function (i) { return i.id === t.dataset.price; })[0];
    if (item) {
      var v = parseFloat(t.value);
      item.price = isNaN(v) ? null : v;
      if (item.price != null) db.prices[norm(item.name)] = item.price;
      save(); renderList();
    }
  }
});

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-check],[data-del],[data-close],[data-savechore],[data-saverecipe],[data-saveitem],'
    + '[data-pantry],[data-plan],[data-unplan],[data-editrecipe],[data-delrecipe],[data-buildlist],[data-gcheck],[data-gdel],[data-clearchecked]');
  if (!el) return;
  var d = el.dataset;

  if (d.close) return closeSheet();

  if (d.check) {
    var parts = d.check.split(':');
    var wasOn = (parts[0] === 'chore') ? doneToday(parts[1]) : false;
    if (!wasOn) ripple(el);
    if (parts[0] === 'chore') {
      var c = db.chores.filter(function (x) { return x.id === parts[1]; })[0];
      if (c) {
        if (c.last === ymd(today()) && !c.never) {
          // untick: put back whatever it said before
          if (c.prev) { c.last = c.prev.last; c.never = c.prev.never; }
          else { c.last = ymd(addDays(today(), -c.every)); c.never = true; }
          delete c.prev;
        } else {
          c.prev = { last: c.last, never: !!c.never };
          c.last = ymd(today());
          c.never = false;
        }
      }
    } else {
      var ev = db.events.filter(function (x) { return x.id === parts[1]; })[0];
      if (ev) ev.done = true;
    }
    save(); return renderTodo();
  }

  if (d.del) {
    var p2 = d.del.split(':');
    if (!confirm('Remove this for good?')) return;
    if (p2[0] === 'chore') db.chores = db.chores.filter(function (x) { return x.id !== p2[1]; });
    else db.events = db.events.filter(function (x) { return x.id !== p2[1]; });
    save(); return renderTodo();
  }

  if (d.savechore) {
    var title = document.getElementById('s-title').value.trim();
    var kind = document.getElementById('s-kind').value;
    var start = document.getElementById('s-start').value;
    if (!title) { alert('Give it a name first.'); return; }
    if (kind === 'once') db.events.push({ id: uid(), title: title, date: start || ymd(today()), done: false });
    else {
      var n = parseInt(kind, 10);
      db.chores.push({ id: uid(), title: title, every: n, last: ymd(addDays(parseYmd(start || ymd(today())), -n)) });
    }
    save(); closeSheet(); return renderTodo();
  }

  if (d.editrecipe) return sheetRecipe(d.editrecipe);

  if (d.saverecipe) {
    var name = document.getElementById('r-name').value.trim();
    var ings = document.getElementById('r-ing').value.split('\n')
      .map(function (s) { return s.trim(); }).filter(Boolean);
    if (!name) { alert('Give the recipe a name.'); return; }
    if (!ings.length) { alert('Add at least one ingredient.'); return; }
    var existingR = db.recipes.filter(function (x) { return x.id === d.saverecipe; })[0];
    if (existingR) { existingR.name = name; existingR.ingredients = ings; }
    else db.recipes.push({ id: uid(), name: name, ingredients: ings });
    save(); closeSheet(); return renderMeals();
  }

  if (d.saveitem) {
    var gn = document.getElementById('g-name').value.trim();
    var gp = parseFloat(document.getElementById('g-price').value);
    if (!gn) { alert('Name the item first.'); return; }
    if (!isNaN(gp)) db.prices[norm(gn)] = gp;
    db.list.push({ id: uid(), name: gn, price: isNaN(gp) ? (db.prices[norm(gn)] || null) : gp, checked: false });
    save(); closeSheet(); return renderList();
  }

  if (d.pantry) {
    var n2 = norm(d.pantry);
    var i2 = db.pantry.map(norm).indexOf(n2);
    if (i2 > -1) db.pantry.splice(i2, 1); else db.pantry.push(d.pantry);
    save(); return renderMeals();
  }

  if (d.plan) { if (db.plan.indexOf(d.plan) === -1) db.plan.push(d.plan); save(); return renderMeals(); }
  if (d.unplan) { db.plan = db.plan.filter(function (x) { return x !== d.unplan; }); save(); return renderMeals(); }
  if (d.delrecipe) {
    var target = db.recipes.filter(function (x) { return x.id === d.delrecipe; })[0];
    if (!confirm('Delete "' + (target ? target.name : 'this recipe') + '"? This cannot be undone.')) return;
    db.recipes = db.recipes.filter(function (x) { return x.id !== d.delrecipe; });
    db.plan = db.plan.filter(function (x) { return x !== d.delrecipe; });
    save(); closeSheet(); return renderMeals();
  }
  if (d.buildlist) return buildList();

  if (d.gcheck) {
    var gi = db.list.filter(function (x) { return x.id === d.gcheck; })[0];
    if (gi && !gi.checked) ripple(el);
    if (gi) gi.checked = !gi.checked;
    save(); return renderList();
  }
  if (d.gdel) { db.list = db.list.filter(function (x) { return x.id !== d.gdel; }); save(); return renderList(); }
  if (d.clearchecked) { db.list = db.list.filter(function (x) { return !x.checked; }); save(); return renderList(); }
});

// ---------- start ----------
db = load();
if (!db) { db = seed(); save(); }
if (!db.prices) db.prices = {};
// older saved data has no 'never' flag; assume untouched unless ticked today
db.chores.forEach(function (c) {
  if (typeof c.never === 'undefined') c.never = (c.last !== ymd(today()));
});
save();
renderAll();
</script>
</body>
</html>
